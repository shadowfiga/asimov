minimum_pre_commit_version: "4.4.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format Graphite.csproj --verify-no-changes --severity warn
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets)$|^\.editorconfig$
      - id: dotnet-build
        name: dotnet build (warnings are errors)
        entry: dotnet build Graphite.csproj --configuration Debug --warnaserror --output .artifacts/pre-commit
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets|json)$|^\.editorconfig$
      - id: chisel-export
        name: Chisel MonoGame export is current
        entry: bun Scripts/export-chisel.ts --check
        language: unsupported
        pass_filenames: false
        files: ^(\.chisel/|Content/Chisel/|GameData/Generated/|Scripts/export-chisel\.ts)
      - id: persistence-tests
        name: persistence checks
        entry: dotnet run --project Tests/Graphite.Persistence.Tests/Graphite.Persistence.Tests.csproj --configuration Debug -p:TreatWarningsAsErrors=true
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets|json)$|^\.editorconfig$
      - id: gameplay-tests
        name: gameplay checks
        entry: dotnet run --project Tests/Graphite.Gameplay.Tests/Graphite.Gameplay.Tests.csproj --configuration Debug -p:TreatWarningsAsErrors=true
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets|json)$|^\.editorconfig$
      - id: audio-tests
        name: audio and managed asset checks
        entry: dotnet run --project Tests/Graphite.Audio.Tests/Graphite.Audio.Tests.csproj --configuration Debug -p:TreatWarningsAsErrors=true -- --assets
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets|json|wav)$|^\.editorconfig$
      - id: ui-tests
        name: UI checks
        entry: dotnet run --project Tests/Graphite.UI.Tests/Graphite.UI.Tests.csproj --configuration Debug -p:TreatWarningsAsErrors=true
        language: unsupported
        pass_filenames: false
        files: ^.*\.(cs|csproj|props|targets|json)$|^\.editorconfig$
